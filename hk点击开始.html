<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>你最棒</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;}
body {
  overflow: hidden;
  height: 100vh;
  background: #0a0c1a;
  font-family: "微软雅黑", "苹方", sans-serif;
  position: relative;
  cursor: pointer;
}
/* 星空画布 */
#starCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
}
/* 励志文字 */
.txt {
  position: absolute;
  left: 50%;
  bottom: 38%;
  transform: translateX(-50%);
  font-size: 70px;
  font-weight: 550;
  letter-spacing: 5px;
  text-shadow: 
    0 0 8px rgba(255,240,210,0.7),
    0 0 18px rgba(255,225,180,0.5),
    0 0 30px rgba(255,210,150,0.3);
  animation: fly 10s ease forwards;
  white-space: nowrap;
  z-index: 9;
  color: #fff0d8;
}
@keyframes fly {
  0% {opacity:0; transform:translateX(-50%) scale(0.55);}
  20% {opacity:1; transform:translateX(-50%) scale(1.1);}
  100% {opacity:0; transform:translate(-50%, -400px) scale(1.25);}
}
/* 点击引导提示 */
.tip {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%,-50%);
  font-size: 30px;
  color: rgba(255,255,255,0.7);
  z-index: 10;
  letter-spacing: 2px;
  transition: opacity 0.8s ease;
}
</style>
</head>
<body>
<!-- 星空画布 -->
<canvas id="starCanvas"></canvas>
<!-- 点击提示 -->
<div class="tip" id="tip">点击页面 享受鼓励</div>

<script>
// 30句无重复励志文案
const words = [
"你的坚持，终将照亮前路",
"默默努力的时光都在发光",
"踏实沉淀，未来自有答案",
"慢慢来，优秀会如约而至",
"你积攒的力量从不被辜负",
"心有微光，便能奔赴远方",
"每一步前行都算数",
"沉稳上进的你自带光芒",
"所有耕耘，皆有美好回响",
"眼底有光，心中自有方向",
"脚踏实地，终能仰望星光",
"认真生长，悄悄惊艳时光",
"不负当下，未来步步生花",
"心怀热忱，前路温暖坦荡",
"坚定本心，万事皆可顺遂",
"熬过沉淀，便是繁花盛开",
"你比想象中更坚韧优秀",
"所有美好，正在慢慢奔赴",
"深耕自己，静待风生水起",
"保持热爱，日子自带温柔",
"稳步向前，好运一路相伴",
"默默发力，终会脱颖而出",
"善良努力，自有万千偏爱",
"目光长远，不惧一时风雨",
"认真生活，藏着无限惊喜",
"笃定前行，终抵理想彼岸",
"日积月累，成就更好的你",
"内心丰盈，一生自带福气",
"向阳而生，永远闪闪发光",
"全力以赴，不负每一份初心"
];

// 星空初始化
const canvas = document.getElementById('starCanvas');
const ctx = canvas.getContext('2d');
let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;
let stars = [];
let starCount = 800;
let shineBoost = 1;

for(let i = 0; i < starCount; i++){
  stars.push({
    x: Math.random() * w,
    y: Math.random() * h,
    r: Math.random() * 1.2,
    speed: Math.random() * 0.25,
    twinkle: Math.random() * Math.PI * 2
  });
}

function drawStar(){
  ctx.fillStyle = '#0a0c1a';
  ctx.fillRect(0,0,w,h);
  for(let i=0; i<stars.length; i++){
    let s = stars[i];
    s.twinkle += 0.03;
    let alpha = (Math.sin(s.twinkle) + 1) / 2 * shineBoost;
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle = `rgba(255,250,235,${alpha})`;
    ctx.fill();
    s.y += s.speed;
    if(s.y > h){s.y = 0;s.x = Math.random()*w;}
  }
  requestAnimationFrame(drawStar);
}
drawStar();

window.addEventListener('resize',()=>{
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;
});

// 交互：仅点击一次开启，开启后提示消失，永久播放
let isStart = false;
let timer = null;
let index = 0;
const tip = document.getElementById('tip');

// 生成文字+星空闪耀
function createText(){
  shineBoost = 1.6;
  setTimeout(()=>shineBoost = 1,2500);

  const el = document.createElement("div");
  el.className = "tip";
  el.className = "txt";
  el.innerText = words[index % words.length];
  index++;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 10000);
}

// 点击触发一次
document.body.addEventListener('click',()=>{
  if(!isStart){
    isStart = true;
    // 提示文字慢慢消失
    tip.style.opacity = 0;
    // 启动循环文案
    timer = setInterval(createText, 3800);
  }
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>那些年NCTDREAM的惊为天人的舞台</title>
    <style>
        /* 全局基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            background-color: #39FF14; /* 荧光绿背景 */
            font-family: "幼圆", sans-serif;
            min-height: 100vh;
        }

        /* 标题样式：放大+奶酪体+黑色 */
        h1 {
            text-align: center;
            color: #000000; /* 黑色 */
            font-family: "奶酪体", "Microsoft YaHei", sans-serif; /* 奶酪体 */
            font-weight: bold;
            margin: 20px 0 40px;
            font-size: 34px; /* 放大标题 */
        }

        /* 卡片容器：全屏2行3列，无留白 */
        .card-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            min-height: calc(100vh - 120px);
        }

        /* 单个卡片样式 */
        .card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.12);
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 卡片 hover 效果 */
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        /* 卡片里的图片：调大、全屏显示、不变形 */
        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        /* 卡片里的链接 */
        .card a {
            font-family: "Comic Sans MS", cursive;
            font-weight: bold;
            color: #2e8b57;
            text-decoration: none;
            font-size: 20px;
            display: block;
        }

        .card a:hover {
            color: #006400;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>那些年NCTDREAM的惊为天人的舞台</h1>

    <div class="card-container">
        <!-- 卡片1 -->
        <div class="card">
            <img src="The First and Last.jpg" alt="The First and Last">
            <a href="https://www.bilibili.com/video/BV1B44y1y7SB?spm_id_from=333.788.videopod.episodes&vd_source=c421659a2d4e19c37aa1d608076b66ce&p=17">The First and Last</a>
        </div>

        <!-- 卡片2 -->
        <div class="card">
            <img src="We Young.jpg" alt="We Young">
            <a href="https://www.bilibili.com/video/BV1B44y1y7SB?spm_id_from=333.788.videopod.episodes&vd_source=c421659a2d4e19c37aa1d608076b66ce&p=46">We Young</a>
        </div>

        <!-- 卡片3 -->
        <div class="card">
            <img src="Hello Future.jpg" alt="Hello Future">
            <a href="https://www.bilibili.com/video/BV1B44y1y7SB?spm_id_from=333.788.videopod.episodes&vd_source=c421659a2d4e19c37aa1d608076b66ce&p=119">Hello Future</a>
        </div>

        <!-- 卡片4 -->
        <div class="card">
            <img src="Hot Sauce.jpg" alt="Hot Sauce">
            <a href="https://www.bilibili.com/video/BV1B44y1y7SB?spm_id_from=333.788.videopod.episodes&vd_source=c421659a2d4e19c37aa1d608076b66ce&p=110">Hot Sauce</a>
        </div>

        <!-- 卡片5 -->
        <div class="card">
            <img src="Glitch Mode.jpg" alt="Glitch Mode">
            <a href="https://www.bilibili.com/video/BV1B44y1y7SB?spm_id_from=333.788.videopod.episodes&vd_source=c421659a2d4e19c37aa1d608076b66ce&p=135">Glitch Mode</a>
        </div>

        <!-- 卡片6 -->
        <div class="card">
            <img src="Candy.jpg" alt="Candy">
            <a href="https://www.bilibili.com/video/BV1B44y1y7SB?spm_id_from=333.788.videopod.episodes&vd_source=c421659a2d4e19c37aa1d608076b66ce&p=156">Candy</a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>那些年NCTDREAM的惊为天人的舞台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            background-color: #39FF14;
            font-family: "幼圆", sans-serif;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            color: #000;
            font-family: "奶酪体", "Microsoft YaHei", sans-serif;
            font-weight: bold;
            margin: 20px 0 40px;
            font-size: 36px;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            min-height: calc(100vh - 120px);
        }

        .card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.12);
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .card img {
            width: 100%;
            height: 320px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 18px;
        }

        .card a {
            font-family: "Comic Sans MS", cursive;
            font-weight: bold;
            color: #2e8b57;
            text-decoration: none;
            font-size: 20px;
            display: block;
        }

        .card a:hover {
            color: #006400;
            text-decoration: underline;
        }
    </style>
</head>
